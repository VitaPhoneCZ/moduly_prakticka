<section class="hero" id="uvod">
    <div class="wrapper">
        <div class="hero-content">

                Krátký popis, který vysvětluje o čem stránka je.
                Pár vět stačí – jasné, stručné.
            </p>
            <div class="hero-buttons">
                <a href="#kontakt" class="btn btn-primary">Kontaktujte nás</a>
                <a href="#sluzby" class="btn btn-ghost">Naše služby</a>
            </div>
        </div>
    </div>
</section>
